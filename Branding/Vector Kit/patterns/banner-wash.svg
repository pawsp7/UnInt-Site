<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Banner wash background" fill="none">
<defs>
    <linearGradient id="uni-jelly" x1="10%" y1="4%" x2="90%" y2="92%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#BAF837"/>
    <stop offset="42%" stop-color="#BAF837"/>
    <stop offset="58%" stop-color="#FA4A9E"/>
    <stop offset="100%" stop-color="#FA4A9E"/>
  </linearGradient>
    <radialGradient id="wine-wash" cx="8%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#591337"/>
      <stop offset="70%" stop-color="#030205"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#BAF837" stroke-width="1.1" opacity="0.18"/>
    </pattern>
    <pattern id="grid-pink" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FA4A9E" stroke-width="1.1" opacity="0.16"/>
    </pattern>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1200" height="400" fill="url(#grid-fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="400" fill="#030205"/>
  <rect width="1200" height="400" fill="url(#wine-wash)"/>
  <rect width="1200" height="400" fill="url(#grid)" mask="url(#grid-mask)"/>
  <rect width="1200" height="400" fill="url(#grid-pink)" opacity="0.55"/>
</svg>
