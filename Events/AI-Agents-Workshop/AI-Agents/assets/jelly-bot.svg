<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 96" role="img" aria-label="Jelly bot" fill="none">
  <!-- Jelly mascot swimming over two flowing tentacle trails -->
  <defs>
    <linearGradient id="jb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cc4e8"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAF837"/>
      <stop offset="100%" stop-color="#FA4A9E"/>
    </linearGradient>
  </defs>

  <!-- flowing trails (kept from the wave, thinner) -->
  <path d="M8 26 C 40 12, 42 52, 74 40 C 106 28, 108 66, 140 54 C 168 44, 180 66, 202 60"
        fill="none" stroke="url(#fl)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M18 44 C 46 36, 54 74, 92 64 C 128 54, 138 84, 176 74"
        fill="none" stroke="url(#fl)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- jelly: side fins -->
  <path d="M96 30 C 84 26, 76 30, 72 38 C 80 42, 90 42, 96 38 Z" fill="#8aa8e8" opacity="0.9"/>
  <path d="M126 30 C 138 26, 146 30, 150 38 C 142 42, 132 42, 126 38 Z" fill="#8aa8e8" opacity="0.9"/>
  <!-- jelly: dome -->
  <path d="M111 8 C 96 8, 88 20, 88 32 C 88 44, 96 50, 111 50 C 126 50, 134 44, 134 32 C 134 20, 126 8, 111 8 Z" fill="url(#jb)"/>
  <!-- antenna -->
  <path d="M111 8 V 20 M111 20 L 104 27 M111 20 L 118 27" stroke="#3a5a8c" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="111" cy="7" r="2.5" fill="#3a5a8c"/>
  <!-- eyes: big dark with light pupils -->
  <circle cx="103" cy="32" r="7" fill="#1a1a24"/>
  <circle cx="119" cy="32" r="7" fill="#1a1a24"/>
  <circle cx="105" cy="30" r="2.4" fill="#f5edaa"/>
  <circle cx="121" cy="30" r="2.4" fill="#f5edaa"/>
  <circle cx="102" cy="34" r="1" fill="#8a87a0"/>
  <circle cx="118" cy="34" r="1" fill="#8a87a0"/>
  <!-- short tentacles -->
  <path d="M98 50 C 96 56, 92 58, 88 60 M105 52 C 105 58, 103 62, 100 64 M117 52 C 117 58, 119 62, 122 64 M124 50 C 126 56, 130 58, 134 60"
        stroke="#6fc3d9" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
