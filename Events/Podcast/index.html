<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast posters — Unnatural Intelligence</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { padding: 48px 24px 80px; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: var(--display); font-weight: 700; text-transform: uppercase;
    font-size: 46px; letter-spacing: -0.045em; line-height: 0.88; margin: 0 0 12px;
  }
  h1 span { color: var(--pink); }
  .lede { line-height: 1.45; color: rgba(249,249,250,.78); max-width: 740px; margin: 0; }
  .grid {
    list-style: none; padding: 0; margin: 32px 0 0;
    display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }
  figure { margin: 0; background: var(--ink); border: 1px solid rgba(186,248,55,.28); }
  figure img { width: 100%; height: auto; display: block; background: #111; }
  figcaption { padding: 14px 16px 16px; }
  figcaption strong { display: block; text-transform: uppercase; letter-spacing: -0.03em; margin-bottom: 4px; }
  figcaption span { display: block; font-family: var(--mono); font-size: 12px; color: rgba(249,249,250,.62); margin-bottom: 12px; line-height: 1.4; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a {
    text-decoration: none; color: var(--ink); background: var(--lime);
    padding: 8px 12px; font-weight: 700; font-size: 13px;
  }
  .links a.html { background: transparent; color: var(--lime); border: 1px solid rgba(186,248,55,.45); }
</style>
</head>
